#==============================================================================
# LOW RESOURCE MONITORING STACK
#==============================================================================

#==============================================================================
# STACK IDENTITY
#==============================================================================

name: monitoring-stack

#==============================================================================
# MONITORING SERVICES
#==============================================================================

services:
  #============================================================================
  # PROMETHEUS SERVICE
  #============================================================================

  prometheus:
    image: prom/prometheus:v3.14.0

    #==========================================================================
    # PROMETHEUS RUNTIME
    #==========================================================================

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --query.max-concurrency=10
      - --query.timeout=2m
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
      - --storage.tsdb.wal-compression
      - --web.enable-lifecycle

    #==========================================================================
    # PROMETHEUS RESOURCE LIMITS
    #==========================================================================

    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 1536M

            #==========================================================================
            # PROMETHEUS NETWORK AND STORAGE
            #==========================================================================

    ports:
      - 127.0.0.1:9090:9090
    restart: unless-stopped
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  #============================================================================
  # ALERTMANAGER SERVICE
  #============================================================================

  alertmanager:
    image: prom/alertmanager:v0.34.0

    #==========================================================================
    # ALERTMANAGER RUNTIME
    #==========================================================================

    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=

    #==========================================================================
    # ALERTMANAGER RESOURCE LIMITS
    #==========================================================================

    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 64M

    #==========================================================================
    # ALERTMANAGER NETWORK AND STORAGE
    #==========================================================================

    ports:
      - 127.0.0.1:9093:9093
    restart: unless-stopped
    volumes:
      - ./config/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  #============================================================================
  # GRAFANA SERVICE
  #============================================================================

  grafana:
    image: grafana/grafana:13.2.0

    #==========================================================================
    # GRAFANA DEPENDENCIES
    #==========================================================================

    depends_on:
      prometheus:
        condition: service_started

    #==========================================================================
    # GRAFANA RESOURCE LIMITS
    #==========================================================================

    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 512M

            #==========================================================================
            # GRAFANA RUNTIME ENVIRONMENT
            #==========================================================================

    environment:
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
      GF_SERVER_ENABLE_GZIP: "true"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"

    #==========================================================================
    # GRAFANA NETWORK, SECRETS, AND STORAGE
    #==========================================================================

    ports:
      - ${MONITORING_BIND_ADDRESS:-127.0.0.1}:3000:3000
    restart: unless-stopped
    secrets:
      - grafana_admin_password
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  #============================================================================
  # NODE EXPORTER SERVICE
  #============================================================================

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1

    #==========================================================================
    # NODE EXPORTER RUNTIME
    #==========================================================================

    command:
      - --path.rootfs=/host

    #==========================================================================
    # NODE EXPORTER RESOURCE LIMITS
    #==========================================================================

    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 64M

            #==========================================================================
            # NODE EXPORTER HOST ACCESS
            #==========================================================================

    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave

  #============================================================================
  # CADVISOR SERVICE
  #============================================================================

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1

    #==========================================================================
    # CADVISOR RESOURCE LIMITS
    #==========================================================================

    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 192M

            #==========================================================================
            # CADVISOR HOST ACCESS
            #==========================================================================

    privileged: true
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /dev/disk:/dev/disk:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run:/var/run:ro

  #============================================================================
  # BLACKBOX EXPORTER SERVICE
  #============================================================================

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0

    #==========================================================================
    # BLACKBOX EXPORTER RUNTIME
    #==========================================================================

    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml

    #==========================================================================
    # BLACKBOX EXPORTER RESOURCE LIMITS
    #==========================================================================

    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 64M

    #==========================================================================
    # BLACKBOX EXPORTER CONFIGURATION
    #==========================================================================

    ports:
      - 127.0.0.1:9115:9115
    restart: unless-stopped
    volumes:
      - ./config/blackbox:/etc/blackbox_exporter:ro

    #==============================================================================
    # STACK SECRETS
    #==============================================================================

secrets:
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./secrets/grafana-admin-password}

  #==============================================================================
  # PERSISTENT VOLUMES
  #==============================================================================

volumes:
  alertmanager-data:
  grafana-data:
  prometheus-data: