#==============================================================================
# BLACKBOX EXPORTER PROBE CONFIGURATION
#==============================================================================

#==============================================================================
# PROBE MODULES
#==============================================================================

modules:
  #============================================================================
  # HTTPS SUCCESS PROBE
  #============================================================================

  https_2xx:
    prober: http
    timeout: 15s
    http:
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes:
        - 200
        - 302
