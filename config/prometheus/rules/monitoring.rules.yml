#==============================================================================
# MONITORING STACK ALERTS
#==============================================================================

#==============================================================================
# PROMETHEUS RULE GROUPS
#==============================================================================

groups:
  #============================================================================
  # HOST UTILISATION RECORDING RULES
  #============================================================================

  - name: monitoring-recording
    rules:
      - record: instance:node_cpu_utilisation:rate5m
        expr: 1 - avg by (job, host, instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m]))

      - record: instance:node_memory_utilisation:ratio
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)

      - record: instance_device:node_filesystem_utilisation:ratio
        expr: 1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"})

      - record: instance_device:node_filesystem_inode_utilisation:ratio
        expr: 1 - (node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs"})

      - record: name:container_cpu_utilisation:rate5m
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[5m]))

      - record: name:container_memory_utilisation:ratio
        expr: sum by (name) (container_memory_working_set_bytes{name!=""}) / sum by (name) (container_spec_memory_limit_bytes{name!=""} > 0)

  #============================================================================
  # MONITORING STACK ALERT RULES
  #============================================================================

  - name: monitoring-stack
    rules:
      #==========================================================================
      # TARGET AVAILABILITY ALERT
      #==========================================================================

      - alert: PrometheusTargetDown
        expr: up{job!="blackbox"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Prometheus target {{ $labels.job }} is unavailable
          description: Target {{ $labels.instance }} has been unreachable for more than five minutes.

      #==========================================================================
      # GITHUB ACTIONS RUNNER ALERTS
      #==========================================================================

      - alert: GitHubRunnerOffline
        expr: sum by (role) (github_runner_online{job="github-runners"}) < 1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: GitHub Actions {{ $labels.role }} runner is offline
          description: No online BharathCoudOps OCI platform runner has been available for this role for three minutes.

      - alert: GitHubRunnerMetricsStale
        expr: time() - node_textfile_mtime_seconds{job="github-runners",file="github_runner.prom"} > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: GitHub Actions runner metrics are stale
          description: The OCI platform runner metrics exporter has not refreshed successfully for more than three minutes.

      - alert: GitHubActionsQueueBlocked
        expr: github_actions_oci_queued_jobs{job="github-runners"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: GitHub Actions {{ $labels.role }} runner queue is blocked
          description: One or more jobs requesting the BharathCoudOps OCI {{ $labels.role }} runner have remained queued for at least fifteen minutes.

      - alert: GitHubActionsRecentFailures
        expr: github_actions_failed_runs_6h{job="github-runners"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: GitHub Actions workflows have recent failures
          description: At least one workflow run has failed during the last six hours.

      #==========================================================================
      # BACKSTAGE PLATFORM ALERTS
      #==========================================================================

      - alert: BackstageNotReady
        expr: probe_success{job="backstage-health"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: Backstage is not ready
          description: The BharathCoudOps Backstage readiness endpoint has failed for three minutes.

      - alert: BackstagePostgreSQLDown
        expr: pg_up{job="backstage-postgres"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: Backstage PostgreSQL is unavailable
          description: The Backstage PostgreSQL exporter cannot connect to the database.

      - alert: BackstagePostgreSQLConnectionPressure
        expr: sum(pg_stat_activity_count{job="backstage-postgres"}) / max(pg_settings_max_connections{job="backstage-postgres"}) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Backstage PostgreSQL connections exceed 80 percent
          description: Backstage PostgreSQL has sustained high connection utilisation for ten minutes.

      - alert: BackstageBackupStale
        expr: absent(backstage_backup_last_success_timestamp_seconds{job="backstage-backup"}) or time() - backstage_backup_last_success_timestamp_seconds{job="backstage-backup"} > 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Backstage backup is stale
          description: No successful Backstage PostgreSQL backup has been recorded within 24 hours.

      #==========================================================================
      # EXTERNAL ENDPOINT ALERTS
      #==========================================================================

      - alert: ExternalEndpointDown
        expr: probe_success{job="blackbox"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: External endpoint {{ $labels.instance }} is unavailable
          description: The endpoint probe has failed continuously for more than three minutes.

      - alert: TLSCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox"} - time() < 1209600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: TLS certificate for {{ $labels.instance }} expires within 14 days
          description: Renew the endpoint certificate before external access is interrupted.

      #==========================================================================
      # CLOUDFLARE TUNNEL ALERTS
      #==========================================================================

      - alert: CloudflareTunnelMetricsMissing
        expr: absent(up{job="cloudflared"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Cloudflare Tunnel metrics target is missing
          description: Prometheus has no discovered cloudflared target.

      - alert: CloudflareTunnelNoConnections
        expr: absent(cloudflared_tunnel_ha_connections) or sum(cloudflared_tunnel_ha_connections) < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Cloudflare Tunnel has no active edge connections
          description: The connector has reported no healthy edge connection for five minutes.

      - alert: CloudflareTunnelOriginErrors
        expr: sum by (instance) (increase(cloudflared_tunnel_response_by_code{code=~"5.."}[5m])) > 0 or sum by (instance) (increase(cloudflared_tunnel_request_errors[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Cloudflare Tunnel is returning origin errors
          description: Connector {{ $labels.instance }} has returned HTTP 5xx responses or origin request errors during the last five minutes.

      #==========================================================================
      # HOST CPU ALERT
      #==========================================================================

      - alert: HostCPUPressure
        expr: instance:node_cpu_utilisation:rate5m > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host CPU utilisation is above 90 percent
          description: Host {{ $labels.instance }} has sustained high CPU utilisation for 15 minutes.

      #==========================================================================
      # HOST MEMORY ALERT
      #==========================================================================

      - alert: HostMemoryPressure
        expr: instance:node_memory_utilisation:ratio > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host memory utilisation is above 90 percent
          description: Host {{ $labels.instance }} has sustained high memory utilisation for 15 minutes.

      #==========================================================================
      # HOST DISK ALERT
      #==========================================================================

      - alert: HostDiskPressure
        expr: instance_device:node_filesystem_utilisation:ratio > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host filesystem utilisation is above 90 percent
          description: Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is running out of space.

      - alert: HostDiskCritical
        expr: instance_device:node_filesystem_utilisation:ratio > 0.97
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Host filesystem utilisation is above 97 percent
          description: Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} requires immediate action.

      - alert: HostInodePressure
        expr: instance_device:node_filesystem_inode_utilisation:ratio > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host filesystem inode utilisation is above 90 percent
          description: Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is running out of inodes.

      - alert: HostSwapPressure
        expr: (node_memory_SwapTotal_bytes{job="node"} > 0) and ((node_memory_SwapTotal_bytes{job="node"} - node_memory_SwapFree_bytes{job="node"}) / node_memory_SwapTotal_bytes{job="node"} > 0.50)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host swap utilisation is above 50 percent
          description: Host {{ $labels.host }} has sustained swap pressure for 15 minutes.

      - alert: HostSystemdUnitFailed
        expr: node_systemd_unit_state{job="node",state="failed"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A managed host systemd unit has failed
          description: Unit {{ $labels.name }} on {{ $labels.host }} has remained failed for five minutes.

      - alert: ManagedStoragePathMissing
        expr: bharath_managed_path_available{job="node"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A managed storage path is missing
          description: Path {{ $labels.path }} on {{ $labels.host }} has been unavailable for 15 minutes.

      #========================================================================
      # K3S CLUSTER ALERTS
      #========================================================================

      - alert: K3sMetricsCollectorFailed
        expr: bharath_k3s_collector_success == 0 or absent(bharath_k3s_collector_success)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: K3s state metrics are unavailable
          description: The K3s state collector has failed or stopped reporting for five minutes.

      - alert: K3sNodeNotReady
        expr: bharath_k3s_node_ready == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A K3s node is not ready
          description: K3s node {{ $labels.node }} has not been ready for five minutes.

      - alert: K3sWorkloadUnavailable
        expr: bharath_k3s_deployment_replicas_available < bharath_k3s_deployment_replicas_desired
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A K3s deployment has unavailable replicas
          description: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has missed its desired replica count for ten minutes.

      - alert: K3sStatefulSetUnavailable
        expr: bharath_k3s_statefulset_replicas_ready < bharath_k3s_statefulset_replicas_desired
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A K3s StatefulSet has unavailable replicas
          description: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has missed its desired replica count for ten minutes.

      - alert: K3sPodFailed
        expr: bharath_k3s_pods{phase="Failed"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Failed pods exist in K3s
          description: Namespace {{ $labels.namespace }} contains failed pods.

      - alert: K3sContainerRestarting
        expr: increase(bharath_k3s_container_restarts_total[15m]) > 2
        labels:
          severity: warning
        annotations:
          summary: A K3s container is repeatedly restarting
          description: Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} restarted more than twice in 15 minutes.

      - alert: K3sPersistentVolumeClaimUnbound
        expr: bharath_k3s_pvc_bound == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A K3s persistent volume claim is unbound
          description: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has been unbound for ten minutes.

      #========================================================================
      # WORDPRESS PLATFORM ALERTS
      #========================================================================

      - alert: WordPressDeploymentUnavailable
        expr: bharath_k3s_deployment_replicas_available{namespace="ignitox",deployment=~"wordpress|redis"} < bharath_k3s_deployment_replicas_desired{namespace="ignitox",deployment=~"wordpress|redis"}
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: An Ignitox WordPress deployment is unavailable
          description: Deployment {{ $labels.deployment }} has missed its desired replica count for five minutes.

      - alert: WordPressDatabaseUnavailable
        expr: bharath_k3s_statefulset_replicas_ready{namespace="ignitox",statefulset="mariadb"} < 1 or bharath_wordpress_mariadb_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The Ignitox WordPress database is unavailable
          description: MariaDB has no ready replica in the ignitox namespace.

      - alert: WordPressDatabaseConnectionPressure
        expr: bharath_wordpress_mariadb_threads_connected / bharath_wordpress_mariadb_max_connections > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Ignitox WordPress database connections exceed 80 percent
          description: MariaDB connection usage has remained high for ten minutes.

      - alert: WordPressRedisUnavailable
        expr: bharath_wordpress_redis_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Ignitox WordPress Redis is unavailable
          description: Redis health metrics have been unavailable for five minutes.

      - alert: WordPressRedisEvictions
        expr: increase(bharath_wordpress_redis_evicted_keys_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Ignitox WordPress Redis is evicting keys
          description: Redis evicted one or more cache keys during the last 15 minutes.

      - alert: WordPressBackupStale
        expr: time() - bharath_wordpress_backup_last_success_timestamp_seconds > 93600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: The Ignitox WordPress backup is stale
          description: No successful WordPress backup has completed during the last 26 hours.

      #==========================================================================
      # CONTAINER RESOURCE ALERT
      #==========================================================================

      - alert: ContainerMemoryPressure
        expr: name:container_memory_utilisation:ratio > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Container {{ $labels.name }} memory utilisation is above 90 percent
          description: The container has remained close to its memory limit for ten minutes.

      #==========================================================================
      # PROMETHEUS CONTROL PLANE ALERTS
      #==========================================================================

      - alert: PrometheusConfigurationReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Prometheus configuration reload failed
          description: Prometheus is continuing with an older configuration.

      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prometheus rule evaluations are failing
          description: At least one recording or alert rule failed during the last ten minutes.

      - alert: PrometheusStoragePressure
        expr: prometheus_tsdb_storage_blocks_bytes > 7516192768
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Prometheus TSDB blocks exceed seven GiB
          description: Stored blocks are approaching the configured eight GiB retention limit.

      #==========================================================================
      # ALERT DELIVERY FAILURE
      #==========================================================================

      - alert: AlertmanagerNotificationFailures
        expr: increase(alertmanager_notifications_failed_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Alertmanager email delivery is failing
          description: Alertmanager could not deliver one or more notifications during the last ten minutes.