#==============================================================================
# PROMETHEUS SCRAPE CONFIGURATION
#==============================================================================

#==============================================================================
# GLOBAL EVALUATION SETTINGS
#==============================================================================

global:
  scrape_interval: 60s
  evaluation_interval: 60s

#==============================================================================
# RULE FILE DISCOVERY
#==============================================================================

rule_files:
  - /etc/prometheus/rules/*.yml

#==============================================================================
# SCRAPE JOBS
#==============================================================================

scrape_configs:
  #============================================================================
  # PROMETHEUS SELF MONITORING
  #============================================================================

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

          #============================================================================
          # LINUX HOST METRICS
          #============================================================================

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

          #============================================================================
          # CONTAINER METRICS
          #============================================================================

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

          #============================================================================
          # GRAFANA HEALTH METRICS
          #============================================================================

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000

          #============================================================================
          # CLOUDFLARE CONNECTOR METRICS
          #============================================================================

  - job_name: cloudflared
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cloudflared.json

          #============================================================================
          # JENKINS CONTROLLER METRICS
          #============================================================================

  - job_name: jenkins
    metrics_path: /prometheus
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/jenkins.json