#==============================================================================
# PROMETHEUS SCRAPE CONFIGURATION
#==============================================================================

#==============================================================================
# GLOBAL EVALUATION SETTINGS
#==============================================================================

global:
  scrape_interval: 60s
  evaluation_interval: 60s

#==============================================================================
# ALERTMANAGER ROUTING
#==============================================================================

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

#==============================================================================
# RULE FILE DISCOVERY
#==============================================================================

rule_files:
  - /etc/prometheus/rules/*.yml

#==============================================================================
# SCRAPE JOBS
#==============================================================================

scrape_configs:
  #============================================================================
  # PROMETHEUS SELF MONITORING
  #============================================================================

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

          #============================================================================
          # LINUX HOST METRICS
          #============================================================================

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

          #============================================================================
          # CONTAINER METRICS
          #============================================================================

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

          #============================================================================
          # GRAFANA HEALTH METRICS
          #============================================================================

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000

          #============================================================================
          # ALERTMANAGER HEALTH METRICS
          #============================================================================

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

          #============================================================================
          # BLACKBOX EXPORTER HEALTH METRICS
          #============================================================================

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

          #============================================================================
          # EXTERNAL HTTPS PROBES
          #============================================================================

  - job_name: blackbox
    metrics_path: /probe
    params:
      module:
        - https_2xx
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox.json
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

          #============================================================================
          # BACKSTAGE READINESS PROBE
          #============================================================================

  - job_name: backstage-health
    metrics_path: /probe
    params:
      module:
        - http_2xx
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/backstage.json
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

          #============================================================================
          # BACKSTAGE POSTGRESQL METRICS
          #============================================================================

  - job_name: backstage-postgres
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/backstage-postgres.json

          #============================================================================
          # BACKSTAGE BACKUP METRICS
          #============================================================================

  - job_name: backstage-backup
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/backstage-backup.json

          #============================================================================
          # CLOUDFLARE CONNECTOR METRICS
          #============================================================================

  - job_name: cloudflared
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cloudflared.json

          #============================================================================
          # JENKINS CONTROLLER METRICS
          #============================================================================

  - job_name: jenkins
    metrics_path: /prometheus/
    basic_auth:
      username: admin
      password_file: /run/secrets/jenkins-admin-password
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/jenkins.json