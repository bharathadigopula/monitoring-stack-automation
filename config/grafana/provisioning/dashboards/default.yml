#==============================================================================
# GRAFANA DASHBOARD PROVISIONING
#==============================================================================

#==============================================================================
# GRAFANA PROVISIONING API
#==============================================================================

apiVersion: 1

#==============================================================================
# DASHBOARD PROVIDERS
#==============================================================================

providers:
  - name: Infrastructure
    folder: Infrastructure
    type: file
    disableDeletion: true
    updateIntervalSeconds: 60
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards